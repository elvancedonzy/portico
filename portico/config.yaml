name: "Portico"
description: "Keep Airbnb / Booking.com / VRBO reservations in sync with your smart locks. Extensions and cancellations flow to the PIN in under 2 minutes."
version: "0.3.1"
slug: "portico"
init: false
arch:
  - aarch64
  - amd64
startup: application
boot: auto
# Note: no `ports:` mapping — port 8765 is not published to the LAN.
# Access the UI via HA Ingress (sidebar panel or Add-on -> "Open Web UI").
# Other add-ons on hassio_network can still reach the container by
# hostname (e.g. from HA REST sensors), but LAN cannot.
ingress: true
ingress_port: 8765
panel_icon: mdi:key-chain-variant
panel_title: Portico
homeassistant_api: true
map:
  - config:rw
options:
  # Site branding — shown in the dashboard header
  site_name: "My STR"

  # Seam API keys — get from https://console.seam.co
  # Two accounts supported so you can isolate room locks from main-entry locks
  account1_api_key: ""
  account2_api_key: ""

  # Optional: Booking.com email intake (Gmail App Password)
  # SEE SECURITY.md BEFORE ENABLING — Booking.com sends reservation confirmations
  # to your inbox; this poller creates lock codes from them. If your inbox is
  # ever compromised, a forged email = an unlock.
  gmail_user: ""
  gmail_app_password: ""

  # Room locks — one entry per interior room lock (uses account1_api_key).
  # Get device_id from Seam console → Devices, or leave empty and use only main entry.
  rooms:
    - name: "Room 1"
      device_id: ""

  # Main entry locks (use account2_api_key)
  front_door_device_id: ""
  basement_device_id: ""

  # Permanent codes never touched by sync/cleanup (owners, cleaners, etc.)
  skip_codes:
    - "Owner"
    - "Cleaner"

  # Prefix conventions for lock-to-lock mirrors (owned by seam_sync)
  # Change only if you already have codes that start with "s~" or "h~"
  room_to_door_prefix: "s~ "
  door_to_room_prefix: "h~ "

  # v0.3.1 — Manual early check-in overrides
  # Dashboard exposes shift-buttons on each guest card.
  # dry_run: true logs intent but writes nothing to Seam. Flip false after button-soak.
  # max_delta_h: cap in hours; larger requests need confirm:"YES" in the API body.
  time_override_dry_run: true
  time_override_max_delta_h: 6
schema:
  site_name: str?
  account1_api_key: str?
  account2_api_key: str?
  gmail_user: str?
  gmail_app_password: password?
  rooms:
    - name: str
      device_id: str?
  front_door_device_id: str?
  basement_device_id: str?
  skip_codes:
    - str
  room_to_door_prefix: str?
  door_to_room_prefix: str?
  time_override_dry_run: bool?
  time_override_max_delta_h: int?
